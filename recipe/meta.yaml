{% set name = "bibtexparser" %}
{% set version = "1.4.4" %}
{% set sha256 = "093b6c824f7a71d3a748867c4057b71f77c55b8dbc07efc993b781771520d8fb" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/b/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pyparsing >=2.0.3
    - python {{ python_min }}
    - setuptools
  run:
    - pyparsing >=2.0.3
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports: bibtexparser

about:
  home: https://bibtexparser.readthedocs.org/
  license: LGPL-3.0-only OR BSD-3-Clause
  license_file: COPYING
  summary: A module for parsing BibTeX files.

extra:
  recipe-maintainers:
    - pkgw
