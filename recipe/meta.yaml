{% set name = "bibtexparser" %}
{% set version = "2.1.0" %}
{% set sha256 = "9f48851eef4693cb7ef6897f7628966c5d0ef49b6403b13a862679a4c313d176" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/b/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pylatexenc >=2.10
    - python {{ python_min }}
    - setuptools
  run:
    - pylatexenc >=2.10
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports: bibtexparser

about:
  home: https://bibtexparser.readthedocs.org/
  license: MIT
  license_file: LICENSE
  summary: A module for parsing BibTeX files.

extra:
  recipe-maintainers:
    - pkgw
