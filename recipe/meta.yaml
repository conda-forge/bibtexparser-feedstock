{% set name = "bibtexparser" %}
{% set version = "2.0.0" %}
{% set sha256 = "7f1e1d989282836a0ba39caf88ecc8982dfd924a4f49de58167d7effe99768e8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/b/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pylatexenc >=2.10
    - python {{ python_min }}
    - setuptools
  run:
    - pylatexenc >=2.10
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports: bibtexparser

about:
  home: https://bibtexparser.readthedocs.org/
  license: MIT
  license_file: LICENSE
  summary: A module for parsing BibTeX files.

extra:
  recipe-maintainers:
    - pkgw
